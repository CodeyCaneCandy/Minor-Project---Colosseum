<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colosseum | Session Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛 Colosseum</h1>
            <p>Automated Model Performance Evaluator</p>
        </header>

        <div class="setup-card">
            <section id="step-upload" class="step active">
                <div class="step-header"><span>01</span> Upload Dataset</div>
                <input type="file" id="fileInput" hidden>
                <div class="drop-zone" id="dropZone">
                    <p>Drag & drop CSV or click to browse</p>
                </div>
                <div id="fileInfo" class="hidden">
                    <p>Selected: <span id="fileName"></span></p>
                    <button type="button" id="uploadBtn" class="btn-primary">Upload & Continue</button>
                </div>
            </section>

            <section id="step-task" class="step">
                <div class="step-header"><span>02</span> Select Task</div>
                <div class="grid-buttons">
                    <button type="button" onclick="selectTask('classification', 'tabular')" class="task-btn">Tabular Classification</button>
                    <button type="button" onclick="selectTask('regression', 'tabular')" class="task-btn">Tabular Regression</button>
                    <button type="button" onclick="selectTask('classification', 'text')" class="task-btn">Text Classification</button>
                </div>
            </section>

            <section id="step-config" class="step">
                <div class="step-header"><span>03</span> Final Configuration</div>
                <div class="form-group">
                    <label>Target Column (Label)</label>
                    <input type="text" id="targetCol" placeholder="e.g. quality or sentiment">
                </div>
                <div id="textColGroup" class="form-group hidden">
                    <label>Text Column</label>
                    <input type="text" id="textCol" placeholder="e.g. review_text">
                </div>
                <button type="button" id="finishBtn" class="btn-primary">Ready for Evaluation</button>
            </section>
        </div>

        <footer id="statusFooter">
            Status: <span id="statusText">Waiting for upload...</span>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
